name: Seguridad y CI

# Auditoria de dependencias (SCA), compilacion y verificaciones de seguridad.
# Parte del proceso de gestion de vulnerabilidades (ISO 27001 A.8.8 / OWASP ASVS V1.1, V14.2).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # revision semanal (lunes 06:00 UTC)

permissions:
  contents: read

jobs:
  sca:
    name: Auditoria de dependencias (SCA)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: transgest-bloque6-backend/transgest-backend
            node_version: 20
          - project: transgest-bloque6-backend/transgest-accounting-api
            node_version: 20
          - project: transgest-bloque6-backend/transgest-frontend
            node_version: 24
          - project: transgest-bloque6-backend/transgest-accounting-frontend
            node_version: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Instalar dependencias
        working-directory: ${{ matrix.project }}
        run: npm ci --ignore-scripts || npm install --ignore-scripts --no-audit --no-fund
      - name: Auditoria de dependencias de produccion
        working-directory: ${{ matrix.project }}
        # Falla el pipeline si hay vulnerabilidades altas o criticas en las
        # dependencias de produccion. Ajusta --audit-level segun la politica.
        run: npm audit --omit=dev --audit-level=high

  syntax-check:
    name: Verificacion de sintaxis (backends)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - transgest-bloque6-backend/transgest-backend
          - transgest-bloque6-backend/transgest-accounting-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: node --check de todo src y scripts
        working-directory: ${{ matrix.project }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find src scripts -type f \( -name '*.js' -o -name '*.cjs' \) -print0)
      - name: Verificar hardening de TransGestAdmin
        if: matrix.project == 'transgest-bloque6-backend/transgest-backend'
        working-directory: ${{ matrix.project }}
        run: node scripts/superadmin_security_check.cjs

  backend-regression:
    name: Regresiones backend TMS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transgest-bloque6-backend/transgest-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: transgest-bloque6-backend/transgest-backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Suite general de regresion
        run: npm run check
      - name: Regresiones de plan diario, permisos y documentos de chofer
        run: npm run daily-plan:regression

  frontend-regression:
    name: Build y tests frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transgest-bloque6-backend/transgest-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: transgest-bloque6-backend/transgest-frontend/package-lock.json
      - name: Instalar dependencias sin scripts nativos
        run: npm ci --ignore-scripts
      - name: Tests unitarios
        env:
          CI: true
        run: npm test -- --watchAll=false --runInBand
      - name: Build de produccion
        # El objetivo de este paso es detectar errores reales de compilacion.
        # React Scripts convierte cualquier warning ESLint en error cuando CI=true;
        # los warnings preexistentes se auditan por separado para no confundirlos
        # con una regresion funcional del build.
        env:
          CI: false
          GENERATE_SOURCEMAP: false
        run: npm run build
